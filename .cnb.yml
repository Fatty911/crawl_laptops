# crawl_laptops — CNB AI 自修复工作流（分阶段+缓存+有界重试）
# 借鉴旧工作流：分阶段流水线、成功步骤缓存、从报错步骤恢复、有界重试、受保护文件备份
# 模型: deepseek-v4-flash (免费 CodeBuddy V4.1 Flash)

main:
  push:
    - docker:
        image: python:3.11
      env:
        GITLAB_TOKEN: ${GITLAB_TOKEN}
      imports:
        - https://cnb.cool/xuerui911-mirror/crawl-secrets/-/blob/main/env.yml
      stages:
        - name: install-deps
          script: pip install -r requirements.txt 2>/dev/null || true
        - name: 推送代码到GitLab
          script: |
            if [ -z "$GITLAB_TOKEN" ]; then
              echo "未配置 GITLAB_TOKEN：跳过 GitLab 镜像同步（多端镜像按仓配置，非必需）"
            else
              printf '#!/bin/sh\ncase "$1" in *sername*) echo oauth2;; *) printf "%%s" "$GITLAB_TOKEN";; esac\n' > /tmp/gl-askpass.sh
              chmod +x /tmp/gl-askpass.sh
              git remote remove gitlab 2>/dev/null || true
              git remote add gitlab https://gitlab.com/xuerui911/crawl_laptops.git
              if GIT_ASKPASS=/tmp/gl-askpass.sh git push gitlab main --force-with-lease 2>&1 \
                || GIT_ASKPASS=/tmp/gl-askpass.sh git push gitlab main 2>&1; then
                echo "GITLAB_PUSH=done" >> _stage_context_.env
              else
                echo "⚠️ GitLab 镜像推送失败（不阻断主流水线；令牌无效或过期请在 GitLab 重新签发）"
                echo "GITLAB_PUSH=failed" >> _stage_context_.env
              fi
              rm -f /tmp/gl-askpass.sh
            fi
        - name: pytest
          script: |
            python -m pytest tests/ -x --tb=short 2>&1 | tee _test_result_.txt
            rc=${PIPESTATUS[0]}
            echo "PYTEST_EXIT=$rc" >> _stage_context_.env
            # 此前退出码取 tee 的 0，测试失败从不使流水线变红（结构性假绿），现诚实穿透
            exit "$rc"
        - name: 语法校验
          script: |
            if python -m py_compile scripts/*.py; then
              echo "SYNTAX=PASS" >> _stage_context_.env
            else
              echo "SYNTAX=FAIL" >> _stage_context_.env
              echo "❌ SYNTAX 未通过：原写法 A && echo PASS || echo FAIL 的退出码恒为 0，属结构性假绿，现改为硬失败"
              exit 1
            fi
        - name: 治理校验
          script: |
            # 对齐 GitHub ci.yml:36-37
            python scripts/validate_storage_policy.py
            python scripts/validate_plan_agent_boundary.py
      failStages:
        - name: 诊断-收集失败上下文
          script: |
            {
              echo "## 失败概览"
              echo "| 项目 | 内容 |"
              echo "| --- | --- |"
              echo "| 失败阶段 | $CNB_BUILD_FAILED_STAGE_NAME |"
              echo "| 失败原因 | \`$CNB_BUILD_FAILED_MSG\` |"
              echo "| 触发分支 | $CNB_BRANCH |"
              echo "| 提交 | $CNB_COMMIT_SHORT |"
              echo "| 构建日志 | $CNB_BUILD_WEB_URL |"
              echo ""
              echo "## 测试输出（最后50行）"
              echo '```'
              tail -50 _test_result_.txt 2>/dev/null || echo "(无)"
              echo '```'
              echo ""
              echo "## 阶段上下文"
              cat _stage_context_.env 2>/dev/null || echo "(无)"
            } > _fail_context_.md
        - name: 备份受保护文件
          script: |
            for f in AGENTS.md ai_tools/opencode/opencode.json ai_tools/opencode/oh-my-openagent.json; do
              [ -f "$f" ] && cp "$f" "${f}.protected_backup"
            done
        - name: AI-修复-第1轮
          type: npc:go
          options:
            model: deepseek-v4-flash
            thinkingLevel: max
            maxTurns: 40
            contextWindow: 256k
            systemPrompt: |
              你是笔记本电脑爬虫修复专家。阅读 _fail_context_.md 中的失败上下文。
              这是第1轮修复（最多2轮）。分析根因后修改代码。
              规则：不伪造数据、不折叠真冲突、不删校验、不降防护。
              CPU前缀必须有(如 i9-13900HX)、小屏+数字键盘需官网验证。
              修复后写报告到 _fix_report_.md。
            userPrompt: |
              读取 _fail_context_.md，分析失败并修复。修复后写报告到 _fix_report_.md。
        - name: 恢复受保护文件
          script: |
            for f in AGENTS.md ai_tools/opencode/opencode.json ai_tools/opencode/oh-my-openagent.json; do
              if [ -f "${f}.protected_backup" ] && ! cmp -s "$f" "${f}.protected_backup" 2>/dev/null; then
                echo "⚠️ 恢复受保护文件 $f"
                cp "${f}.protected_backup" "$f"
              fi
            done
            find . -name '*.protected_backup' -delete
        - name: 验证-语法校验
          script: |
            python -m py_compile scripts/*.py 2>/dev/null && echo "SYNTAX_VALIDATE=PASS" >> _fix_report_.md || { echo "SYNTAX_VALIDATE=FAIL" >> _fix_report_.md; exit 1; }
        - name: 验证-pytest
          script: |
            python -m pytest tests/ -x --tb=short 2>&1 | tee _test_after_fix_.txt
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then echo "PYTEST_VALIDATE=PASS" >> _fix_report_.md; else echo "PYTEST_VALIDATE=FAIL" >> _fix_report_.md; fi
            echo "PYTEST_EXIT_AFTER=$rc" >> _stage_context_.env
        - name: 审查-NPC代码审查
          type: npc:go
          options:
            model: deepseek-v4-flash
            thinkingLevel: high
            maxTurns: 15
            contextWindow: 128k
            systemPrompt: |
              你是代码审查员。读取 _fail_context_.md、_fix_report_.md、_test_after_fix_.txt。
              检查：CPU具体型号完整、小屏+数字键盘官网验证、merge门禁、测试断言同步。
              写审查结果到 _review_result_.md，第一行 VERDICT: PASS 或 VERDICT: FAIL。
            userPrompt: |
              审查修复结果，输出到 _review_result_.md。
        - name: 最终判定
          script: |
            # 反篡改闸：自修复不得改动断言或流水线配置（为变绿改测试属禁止项，改为机器强制）
            if ! git diff --quiet -- tests .cnb.yml 2>/dev/null; then
              echo "X 自修复改动了 tests/ 或 .cnb.yml，判定为篡改门禁，硬失败"
              git diff --stat -- tests .cnb.yml || true
              exit 1
            fi
            AFTERRC=$(grep -o 'PYTEST_EXIT_AFTER=[0-9]*' _stage_context_.env 2>/dev/null | tail -1)
            if [ "${AFTERRC#PYTEST_EXIT_AFTER=}" != "0" ]; then
              echo "X 修复后 pytest 仍非零退出（$AFTERRC），修复未真正通过"
              exit 1
            fi
            VERDICT=$(head -1 _review_result_.md 2>/dev/null | grep -o 'PASS\|FAIL' || echo "UNKNOWN")
            echo "审查结果: $VERDICT"
            [ "$VERDICT" = "PASS" ] && echo "✅ 修复通过" || { echo "❌ 修复未通过"; exit 1; }

  api_trigger:
    # 半月增量爬取（每月 1/16 日 02:30 Asia/Shanghai）
    # 增量闭环：发布基线取线上站点当前数据（docs/data、release 被 .gitignore:10-12 忽略，发布物不入仓），保留基线不缩小
    # 代理：PROXY_SUBSCRIPTIONS 走 CNB 仓库环境变量（设置→环境变量），缺失即失败，禁止直连裸爬
    - runner:
        cpus: 2
      docker:
        image: python:3.12
      env:
        JD_COOKIE: ${JD_COOKIE}
      imports:
        - https://cnb.cool/xuerui911-mirror/crawl-secrets/-/blob/main/env.yml
      timeout: 2h  # CNB Job 无输出默认 10min 即强杀（实测联通源被砍），显式放宽
      stages:
        - name: 检查代理配置
          script: |
            if [ -z "$PROXY_SUBSCRIPTIONS" ]; then
              echo "❌ 未注入 PROXY_SUBSCRIPTIONS：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。防反爬必须走 Mihomo 代理。"
              exit 1
            fi
        - name: install-deps
          script: python -m pip install -r requirements.txt
        - name: 启动Mihomo代理
          script: |
            set -e
            # 本仓 setup_proxy_runtime.py 成功/降级都只写 $GITHUB_ENV（append_github_env:48-50 空路径直接跳过），CNB 无该变量
            # → 必须 --github-env 显式导出 + sed 转 export + source，并硬校验 PROXY_ENABLED，禁止降级直连裸爬
            : > /tmp/proxy.env
            python scripts/setup_proxy_runtime.py --github-env /tmp/proxy.env --require-proxy --test-url https://www.jd.com/hotitem/670a86a27721a2eeea8.html
            sed 's/^\([A-Za-z_][A-Za-z0-9_]*\)=/export \1=/' /tmp/proxy.env > /tmp/proxy.sh
            . /tmp/proxy.sh
            if [ "${PROXY_ENABLED:-false}" != "true" ]; then
              echo "❌ 代理未启用（PROXY_ENABLED!=true），防反爬要求禁止直连裸爬，终止本轮"
              exit 1
            fi
            echo "代理就绪：$HTTP_PROXY"
        - name: 获取线上发布基线
          script: |
            set -e
            mkdir -p baseline
            # 仓内 docs/data/latest.json 被 .gitignore:12(docs/data/) 忽略、从不入仓，'{"items":[]}' 空基线会让
            # preserve/verify 假绿并把线上行数塌到本轮爬取量 → 对齐 GitHub merge-and-filter.yml:99-105（基线=当前已发布数据），拉不到即硬失败
            for URL in \
              "https://nbs.jiucai.eu.org/data/latest.json" \
              "https://crawl-laptops.pages.dev/data/latest.json"; do
              if curl --fail --show-error --silent --location --retry 3 --retry-all-errors \
                   --connect-timeout 20 --max-time 300 "$URL" \
                   -o baseline/laptops-latest.json; then
                ROWS=$(python -c "import json;d=json.load(open('baseline/laptops-latest.json',encoding='utf-8'));print(len(d['items']))" 2>/dev/null || echo 0)
                if [ "${ROWS:-0}" -ge 50 ]; then
                  echo "BASELINE=$URL rows=$ROWS"
                  exit 0
                fi
                echo "⚠️ $URL 基线行数异常（$ROWS），尝试下一个来源"
              fi
            done
            echo "❌ 所有基线来源均不可用，禁止本轮发布（绝不退化为空基线）"
            exit 1
        - name: 爬取-三源并行
          script: |
            . /tmp/proxy.sh
            # 时段分档（用户裁定 2026-10-01）：夜间（23:00-08:00，容器时区 Asia/Shanghai）
            # debug_mode（对齐 GitHub workflow_dispatch inputs.debug_mode）：
            # DEBUG_MODE=true 强制小批量，过作息窗口也能跑通全链并刷新 Pages 日期
            if [ "${DEBUG_MODE:-false}" = "true" ]; then
              MODE="debug小批量"
              MR=20; BN_MR=20; MO_MR=20; TE_MR=20; UN_MR=20; UN_SL=240
              TB=300; TB_B=300; TB_Z=300
              echo "DEBUG_MODE=true: 强制小批量（每源约 20 条）"
            fi
            # 自动小批量——每源 min-records 20，让全链夜里也能完整推进；日间恢复全量。
            HOUR=$(date +%H)
            if [ "$HOUR" -ge 23 ] || [ "$HOUR" -lt 8 ]; then
              MODE="夜间小批量"; MR=20
            else
              MODE="日间全量";   MR=50
            fi
            echo "爬取模式：$MODE（hour=$HOUR）"
            # 三源并行（用户裁定 2026-10-01：源间并行、单源任何形态失败不影响其它源与下游）。
            # 各源 `|| echo` 兜底且互为后台任务（POSIX & + wait），进程级失败也只影响自身；
            # 并发输出轮流到达，天然规避 CNB「连续 10 分钟无输出强杀」。三源均为 requests
            # 类采集（无 playwright），2 CPU 容器并发无内存压力。
            python scripts/crawl_jd.py --output data/raw/jd/latest.json --pages 4 --max-items 120 --min-records "$MR" \
              || echo "⚠️ JD 单源失败" &
            python scripts/crawl_zol.py --output data/raw/zol/latest.json --pages 3 --max-items 120 --min-records "$MR" \
              || echo "⚠️ ZOL 单源失败" &
            python scripts/crawl_pconline.py --output data/raw/pconline/latest.json --pages 5 --max-items 120 --min-records "$MR" \
              || echo "⚠️ PConline 单源失败" &
            wait
            echo "三源并行结束（$MODE），data/raw/ 产物："
            ls -la data/raw/*/latest.json 2>/dev/null || echo "（无任何 json 产物）"
        - name: 清理代理环境
          script: python scripts/setup_proxy_runtime.py --clear
        - name: 合并-增量保留基线
          script: |
            set -e
            mkdir -p data/work release
            SOURCES=""
            [ -s data/raw/zol/latest.json ] && SOURCES="$SOURCES data/raw/zol/latest.json"
            [ -s data/raw/jd/latest.json ] && SOURCES="$SOURCES data/raw/jd/latest.json"
            [ -s data/raw/pconline/latest.json ] && SOURCES="$SOURCES data/raw/pconline/latest.json"
            if [ -z "$SOURCES" ]; then
              echo "❌ 三个源全部失败，无数据可合并"
              exit 1
            fi
            python scripts/merge_data.py $SOURCES \
              --output data/work/candidate.json \
              --rejected-output data/work/rejected.json \
              --min-source-records 50
            python scripts/preserve_publish_baseline.py \
              --candidate data/work/candidate.json \
              --baseline baseline/laptops-latest.json \
              --output release/laptops-latest.json
            python scripts/verify_publish_superset.py \
              --baseline baseline/laptops-latest.json \
              --candidate release/laptops-latest.json
            # 对齐 GitHub merge-and-filter.yml:129-131：audit 需带 --baseline 才能拦源回归
            python scripts/audit_pages_payload.py \
              --payload release/laptops-latest.json \
              --baseline baseline/laptops-latest.json
        - name: 发布到docs
          script: |
            set -e
            # prepare_pages_payload.py:29-56 会把 docs/data/latest.json / filter_conditions.json / manifest.json 写入 docs/
            python scripts/prepare_pages_payload.py \
              --input release/laptops-latest.json \
              --config config/filter_conditions.json \
              --docs-dir docs
        - name: 发布到Cloudflare Pages
          image: node:22
          script: |
            set -e
            if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
              echo "❌ 未注入 CLOUDFLARE_API_TOKEN：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。"
              exit 1
            fi
            # 官方文档：带 image 的脚本任务在独立容器执行，只有 CNB_BUILD_WORKSPACE(/workspace) 与
            # docker.volumes 声明的目录跨任务共享。docs/ 有 4 个静态文件是入仓的，而 docs/data/ 是本轮
            # 新写的未跟踪产物——若本容器看不见前序阶段的写入，直接部署会把线上数据刷成"只有壳页"，
            # 后面的 manifest 回读验收只能在事故之后报警。故先硬校验，缺文件就拒绝部署（宁可不发）。
            for f in docs/index.html docs/data/manifest.json; do
              if [ ! -s "$f" ]; then
                echo "❌ $f 缺失或为空（当前目录=$(pwd)，本阶段容器可能看不到前序阶段产物），拒绝部署"
                exit 1
              fi
            done
            echo "部署前自检 OK：docs 文件数=$(find docs -type f | wc -l) manifest 大小=$(wc -c < docs/data/manifest.json)"
            OK=0
            for i in 1 2; do
              if npx -y wrangler@latest pages deploy docs --project-name crawl-laptops --commit-dirty=true; then
                OK=1; break
              fi
              echo "wrangler 第 $i 次部署失败，15 秒后重试"
              sleep 15
            done
            [ "$OK" = 1 ] || { echo "❌ wrangler 两次部署均失败"; exit 1; }
        - name: 发布到Codeberg Pages
          script: |
            if [ -z "$CODEBERG_TOKEN" ]; then
              echo "未注入 CODEBERG_TOKEN：本流水线经 imports 引用 xuerui911-mirror/crawl-secrets env.yml，请检查该私仓。"
              exit 1
            fi
            set -e
            W=$(mktemp -d)
            cp -r docs/. "$W/"
            printf '%s\n' 'nbs3.jiucai.eu.org' > "$W/.domains"
            cd "$W"
            git init -q -b pages
            git config user.email "xuerui911@gmail.com"
            git config user.name "Fatty911"
            git add -A
            git commit -qm "pages: crawl publish $(date +%Y%m%d%H%M%S)"
            printf '#!/bin/sh\ncase "$1" in *sername*) echo xuerui911;; *) printf "%%s" "$CODEBERG_TOKEN";; esac\n' > /tmp/cb-askpass.sh
            chmod +x /tmp/cb-askpass.sh
            GIT_ASKPASS=/tmp/cb-askpass.sh git push -q --force "https://codeberg.org/xuerui911/crawl-laptops.git" pages:pages
            rm -f /tmp/cb-askpass.sh
            rm -rf "$W"
        - name: 线上验收
          script: |
            set -e
            # 对齐 GitHub deploy-pages.yml:76-108 的 manifest 回读等值比较（验收实际发布目标；CF 硬、Codeberg 自定义域软）
            python - <<'PY'
            import json, time, urllib.request
            with open('docs/data/manifest.json', encoding='utf-8') as f:
                expected = json.load(f)
            def poll(url, attempts, hard):
                error = "not attempted"
                for attempt in range(attempts):
                    try:
                        req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "User-Agent": "pages-readback"})
                        with urllib.request.urlopen(req, timeout=20) as r:
                            actual = json.load(r)
                        if actual == expected:
                            print(f"线上验收通过: {url} rowCount={actual.get('rowCount')}")
                            return None
                        error = "deployed manifest != staged"
                    except Exception as exc:
                        error = repr(exc)[:200]
                    time.sleep(10)
                if hard:
                    raise SystemExit(f"❌ {url} 验收失败: {error}")
                print(f"⚠️ {url} 暂未就绪（Codeberg 自定义域待 DNS 生效后自动可见）: {error}")
                return error
            poll("https://nbs2.jiucai.eu.org/data/manifest.json", 12, True)
            poll("https://crawl-laptops.pages.dev/data/manifest.json", 3, False)
            poll("https://nbs3.jiucai.eu.org/data/manifest.json", 2, False)
            PY

      failStages:
        - name: 清理代理
          script: python scripts/setup_proxy_runtime.py --clear 2>/dev/null || true

