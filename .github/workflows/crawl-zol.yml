name: Crawl ZOL

on:
  workflow_dispatch:
  schedule:
    # Scheduled workflows run from the default branch (main).
    # 03:17 UTC = 11:17 Asia/Shanghai (UTC+8), Monday weekly crawl.
    - cron: "17 3 * * 1"
    # 05:23 UTC = 13:23 Asia/Shanghai (UTC+8), daily afternoon crawl.
    - cron: "23 5 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: crawl-source
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure required crawler proxy
        env:
          PROXY_SUBSCRIPTIONS: ${{ secrets.PROXY_SUBSCRIPTIONS }}
        run: >-
          python scripts/setup_proxy_runtime.py
          --require-proxy
          --test-url
          https://detail.zol.com.cn/notebook_index/subcate16_0_list_1_0_1_2_0_1.html

      - name: Crawl popularity ranking
        run: >-
          python scripts/crawl_zol.py
          --output data/raw/zol/latest.json
          --pages 3
          --max-items 120
          --min-records 50

      - name: Clear crawler proxy environment
        if: always()
        run: python scripts/setup_proxy_runtime.py --clear

      - name: Set artifact date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload crawler data
        uses: actions/upload-artifact@main
        with:
          name: zol-data-${{ steps.date.outputs.date }}
          path: data/raw/zol/latest.json
          if-no-files-found: error
          retention-days: 30
