name: Crawl JD

on:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 2"

permissions:
  contents: read
  actions: write

concurrency:
  group: crawl-jd
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Crawl sales ranking
        env:
          JD_COOKIE: ${{ secrets.JD_COOKIE }}
        run: >-
          python scripts/crawl_jd.py
          --output data/raw/jd/latest.json
          --pages 4
          --max-items 120
          --min-records 50

      - name: Set artifact date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload crawler data
        uses: actions/upload-artifact@main
        with:
          name: jd-data-${{ steps.date.outputs.date }}
          path: data/raw/jd/latest.json
          if-no-files-found: error
          retention-days: 30

