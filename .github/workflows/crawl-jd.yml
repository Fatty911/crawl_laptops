name: Crawl JD

on:
  workflow_dispatch:
  schedule:
    # Scheduled workflows run from the default branch (main).
    # 03:47 UTC = 11:47 Asia/Shanghai (UTC+8), Tuesday weekly crawl.
    - cron: "47 3 * * 2"
    # 05:53 UTC = 13:53 Asia/Shanghai (UTC+8), daily afternoon crawl.
    - cron: "53 5 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: crawl-source
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure required crawler proxy
        env:
          PROXY_SUBSCRIPTIONS: ${{ secrets.PROXY_SUBSCRIPTIONS }}
        run: >-
          python scripts/setup_proxy_runtime.py
          --require-proxy
          --test-url
          https://www.jd.com/hotitem/670a86a27721a2eeea8.html

      - name: Crawl sales ranking
        env:
          JD_COOKIE: ${{ secrets.JD_COOKIE }}
        run: >-
          python scripts/crawl_jd.py
          --output data/raw/jd/latest.json
          --pages 4
          --max-items 120
          --min-records 50

      - name: Clear crawler proxy environment
        if: always()
        run: python scripts/setup_proxy_runtime.py --clear

      - name: Set artifact date
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Upload crawler data
        uses: actions/upload-artifact@main
        with:
          name: jd-data-${{ steps.date.outputs.date }}
          path: data/raw/jd/latest.json
          if-no-files-found: error
          retention-days: 30
