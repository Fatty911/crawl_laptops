# ── GitHub Actions 硬开关（2026-10-05 用户裁定）────────────────────────
# GitHub 账户曾因反滥用机制误伤暂停，爬虫/AI 自修复禁止在 Actions 运行。
# 工作流主力 = 腾讯云 CNB（.cnb.yml）。此处 if:false 防止 UI 误开后仍执行。
# 七端代码对等同步，仅工作流免费资源不同。
name: Crawl Machinike

on:
  workflow_dispatch:
  schedule:
    # 13:30 Asia/Shanghai daily (afternoon window)
    - cron: "30 5 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: machenike-crawl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    if: false  # CNB 为工作流主力，GitHub Actions 禁跑爬虫/AI 自修复
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Configure required crawler proxy
        run: python scripts/setup_proxy_runtime.py

      - name: Crawl MACHENIKE gaming notebooks
        run: |
          python scripts/crawl_machenike.py \
            --output data/raw/machenike/latest.json \
            --max-items 300 \
            --min-records 5 \
            --delay 0.5

      - name: Upload crawler data
        uses: actions/upload-artifact@main
        with:
          name: machenike-data-${{ github.run_id }}
          path: data/raw/machenike/latest.json
          retention-days: 30
          if-no-files-found: error
