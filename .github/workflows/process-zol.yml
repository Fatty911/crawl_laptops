name: Process ZOL raw data

# 处理与爬虫分离：从最新 raw artifact（原始 HTML + 列表记录）重新提取字段。
# 处理逻辑变更（如 CPU 提取规则）时只需重跑本 workflow，无需重新爬取。
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Crawl ZOL"]
    types: [completed]
  schedule:
    # 每天 06:11 UTC = 14:11 Asia/Shanghai（ZOL 下午爬虫完成后自动重处理）
    - cron: "11 6 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: zol-process
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest raw artifact from Crawl ZOL
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          # actions/download-artifact 只能读取当前 workflow run；这里必须通过 GitHub API
          # 选择 Crawl ZOL 产生的最新 zol-raw-* artifact，并完整解压 HTML + 列表 JSON。
          python scripts/download_latest_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow crawl-zol.yml \
            --artifact-prefix zol-raw- \
            --extract-dir raw \
            --min-files 10

      - name: Process raw HTML
        run: |
          RAW_DIR="$(find raw -type d -name raw_html -print -quit)"
          ITEMS_FILE="$(find raw -type f -path '*/raw/zol/latest.json' -print -quit)"
          if [ -z "$ITEMS_FILE" ]; then ITEMS_FILE="$(find raw -type f -name latest.json -print -quit)"; fi
          test -n "$RAW_DIR" || { echo "找不到 raw_html 目录" >&2; exit 2; }
          test -n "$ITEMS_FILE" || { echo "找不到 ZOL latest.json" >&2; exit 2; }
          echo "RAW_DIR=$RAW_DIR"
          echo "ITEMS_FILE=$ITEMS_FILE"
          python scripts/process_zol.py \
            --raw-dir "$RAW_DIR" \
            --items "$ITEMS_FILE" \
            --output data/processed/zol/latest.json
          python - <<'EOF'
          import json
          d = json.load(open("data/processed/zol/latest.json", encoding="utf-8"))
          items = d.get("items", [])
          ok = sum(1 for i in items if i.get("processed_from_raw"))
          print(f"总记录: {len(items)} | 从raw重新处理: {ok}")
          if ok < 10:
              raise SystemExit(f"raw 处理不足 10 条（{ok}），疑似 artifact 异常")
          EOF

      - name: Upload processed data
        uses: actions/upload-artifact@main
        with:
          name: zol-processed-${{ github.run_id }}
          path: data/processed/zol/latest.json
          if-no-files-found: error
          retention-days: 30
