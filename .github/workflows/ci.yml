name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests and static checks
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python -m pytest tests/ -q
          python -m compileall -q scripts tests
          python scripts/validate_storage_policy.py
          python scripts/validate_plan_agent_boundary.py
      - name: Validate syntax of workflows, scripts, and docs
        run: >-
          python scripts/validate_syntax.py
          .github/workflows/*.yml
          scripts/*.py
          docs/*.html docs/*.js docs/*.css

      - name: Validate workflow expectations
        run: python scripts/validate_workflow_expectations.py

      - name: Check patch whitespace
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
