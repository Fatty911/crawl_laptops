name: Merge and Filter

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Crawl ZOL", "Crawl JD", "Crawl PConline"]
    types: [completed]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: merge-and-filter
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Wait for sibling crawler artifacts
        if: github.event_name == 'workflow_run'
        run: |
          echo "Waiting 60s for sibling crawler artifacts to finish uploading..."
          sleep 60

      - name: Download latest complete crawler artifacts
        id: artifacts
        run: |
          mkdir -p data/raw/zol data/raw/jd data/raw/pconline
          echo "skip=false" >> "$GITHUB_OUTPUT"
          set +e
          python scripts/download_latest_crawler_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow crawl-zol.yml \
            --artifact-prefix zol-data- \
            --output data/raw/zol/latest.json \
            --min-records 50 \
            2> >(tee "$RUNNER_TEMP/zol-artifact.err" >&2)
          zol_status=$?
          python scripts/download_latest_crawler_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow crawl-jd.yml \
            --artifact-prefix jd-data- \
            --output data/raw/jd/latest.json \
            --min-records 50 \
            2> >(tee "$RUNNER_TEMP/jd-artifact.err" >&2)
          jd_status=$?
          python scripts/download_latest_crawler_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow crawl-pconline.yml \
            --artifact-prefix pconline-data- \
            --output data/raw/pconline/latest.json \
            --min-records 50 \
            2> >(tee "$RUNNER_TEMP/pconline-artifact.err" >&2)
          pconline_status=$?
          set -e

          if [ "$zol_status" -ne 0 ] &&
             [ "$jd_status" -ne 0 ] &&
             [ "$pconline_status" -ne 0 ] &&
             grep -Fq "no unexpired artifact" "$RUNNER_TEMP/zol-artifact.err" &&
             grep -Fq "no unexpired artifact" "$RUNNER_TEMP/jd-artifact.err" &&
             grep -Fq "no unexpired artifact" "$RUNNER_TEMP/pconline-artifact.err"; then
            echo "No crawler artifacts are available; skipping merge and publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$zol_status" -ne 0 ]; then
            exit "$zol_status"
          fi
          if [ "$jd_status" -ne 0 ]; then
            exit "$jd_status"
          fi
          if [ "$pconline_status" -ne 0 ]; then
            exit "$pconline_status"
          fi

      - name: Download published baseline
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          mkdir -p baseline
          gh release download data-latest \
            --pattern laptops-latest.json \
            --dir baseline || true

      - name: Merge, deduplicate, and enforce publication requirements
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          mkdir -p data/work dist
          python scripts/merge_data.py \
            data/raw/zol/latest.json \
            data/raw/jd/latest.json \
            data/raw/pconline/latest.json \
            --output data/work/candidate.json \
            --rejected-output data/work/rejected.json \
            --min-source-records 50
          python scripts/preserve_publish_baseline.py \
            --candidate data/work/candidate.json \
            --baseline baseline/laptops-latest.json \
            --output dist/laptops-latest.json

      - name: Verify no published identity or source regresses
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          python scripts/verify_publish_superset.py \
            --baseline baseline/laptops-latest.json \
            --candidate dist/laptops-latest.json
          python scripts/audit_pages_payload.py \
            --payload dist/laptops-latest.json \
            --baseline baseline/laptops-latest.json

      - name: Generate merge evidence report
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          python scripts/analysis/merge_evidence_report.py \
            --raw data/raw/zol/latest.json data/raw/jd/latest.json data/raw/pconline/latest.json \
            --merged dist/laptops-latest.json \
            --rejected data/work/rejected.json \
            --output dist/merge-evidence-report.json

      - name: Scan for multi-source enhancement opportunities
        id: mse
        if: steps.artifacts.outputs.skip != 'true'
        continue-on-error: true
        run: |-
          python scripts/multi_source_enhance.py \
            --pages dist/laptops-latest.json \
            --zol data/raw/zol/latest.json \
            --jd data/raw/jd/latest.json \
            --pconline data/raw/pconline/latest.json \
            --output dist/multi-source-report.json
          python3 - <<'PYEOF'
          import json
          d = json.load(open('dist/multi-source-report.json', encoding='utf-8'))
          s = d['summary']
          summary = f"overlap={s['raw_overlap_count']} compatible={s['compatible_overlap_count']} incompatible={s['incompatible_overlap_count']}"
          print('MSE_SUMMARY=' + summary)
          with open('dist/mse_summary.txt', 'w', encoding='utf-8') as f:
              f.write(summary)
          PYEOF
          cat dist/multi-source-report.json | head -30

      - name: File multi-source enhancement issue
        if: steps.mse.outcome == 'success'
        continue-on-error: true
        run: |-
          if [ ! -s dist/mse_summary.txt ]; then
            echo "无扫描结果，跳过"
            exit 0
          fi
          MSE_SUMMARY=$(cat dist/mse_summary.txt)
          echo "MSE_SUMMARY=$MSE_SUMMARY"
          COMPAT=$(echo "$MSE_SUMMARY" | grep -oE "\bcompatible=[0-9]+" | cut -d= -f2 | head -1)
          if [ -n "$COMPAT" ] && [ "$COMPAT" -gt 0 ]; then
            gh issue create               --repo "${{ github.repository }}"               --title "多源率提升：$COMPAT 个兼容跨源重叠未合并"               --label "crawl-failure-diagnosis"               --body "多源扫描发现 $COMPAT 个兼容配置的跨源重叠未进入发布，详见 merge 日志中的 dist/multi-source-report.json。"
          else
            echo "无兼容重叠可提升，跳过 issue"
          fi

      - name: Create or update rolling data release
        if: steps.artifacts.outputs.skip != 'true'
        run: |
          if gh release view data-latest >/dev/null 2>&1; then
            gh release edit data-latest \
              --title "Latest verified laptop data" \
              --notes "Automated verified dataset from ZOL, JD, and PConline."
          else
            gh release create data-latest \
              --target main \
              --title "Latest verified laptop data" \
              --notes "Automated verified dataset from ZOL and JD."
          fi
          gh release upload data-latest \
            dist/laptops-latest.json \
            dist/merge-evidence-report.json \
            --clobber

      - name: Trigger Pages deployment
        if: steps.artifacts.outputs.skip != 'true'
        run: gh workflow run deploy-pages.yml --ref main
