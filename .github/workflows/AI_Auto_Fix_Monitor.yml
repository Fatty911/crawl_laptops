name: AI Auto Fix Monitor

on:
  workflow_run:
    workflows: ["Crawl ZOL", "Crawl JD", "Crawl PConline", "Merge and Filter", "Deploy Pages", "CI"]
    types: [completed]

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: ai-auto-fix-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  ai_monitor:
    name: "AI Diagnose → ${{ github.event.workflow_run.name }}"
    if: >-
      ${{
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
      WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
      WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download completed workflow logs
        run: |
          set +e
          gh run view "$WORKFLOW_RUN_ID" --log-failed > workflow_error.log 2>/tmp/gh_failed_log_error.txt
          gh run view "$WORKFLOW_RUN_ID" --log > workflow_full.log 2>/tmp/gh_full_log_error.txt
          set -e
          LOGS=""
          for candidate in workflow_error.log workflow_full.log; do
            if [ -s "$candidate" ]; then
              LOGS="$LOGS $candidate"
              echo "found log: $candidate ($(wc -c < "$candidate") bytes)"
            fi
          done
          if [ -z "$LOGS" ]; then
            echo "无法获取 workflow 日志"
            echo "no_logs=true" >> "$GITHUB_ENV"
          else
            echo "LOG_FILES=$LOGS" >> "$GITHUB_ENV"
          fi

      - name: Classify run and build diagnosis prompt
        id: classify
        if: env.no_logs != 'true'
        run: >-
          python scripts/workflow_failure_diagnosis.py
          ${{ env.LOG_FILES }}
          --prompt-output diagnosis_prompt.md
          --github-output "$GITHUB_OUTPUT"

      - name: Set up Node.js for Agent tools
        if: steps.classify.outputs.should_diagnose == 'true'
        uses: actions/setup-node@main
        with:
          node-version: "22"

      - name: Install OpenCode CLI (latest, auto-upgrades)
        if: steps.classify.outputs.should_diagnose == 'true'
        run: npm install --global opencode-ai@latest

      - name: Run configured free endpoints for diagnosis
        id: free_route
        if: steps.classify.outputs.should_diagnose == 'true'
        continue-on-error: true
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          MODAL_API_KEY: ${{ secrets.MODAL_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          ATOMGIT_API_KEY: ${{ secrets.ATOMGIT_API_KEY }}
          FREE_LLM_TIMEOUT: "180"
          FREE_LLM_MAX_TOKENS: "4000"
        run: >-
          python scripts/free_first_router.py
          --prompt-file diagnosis_prompt.md
          --output diagnosis_response.json
          --metadata-output diagnosis_route.json
          --github-output "$GITHUB_OUTPUT"
          --max-tokens 4000

      - name: File or update diagnosis issue
        if: steps.classify.outputs.should_diagnose == 'true'
        run: |
          CLASSIFICATION="${{ steps.classify.outputs.classification }}"
          REASON="${{ steps.classify.outputs.reason }}"
          TITLE="[AI诊断] ${WORKFLOW_NAME} ${WORKFLOW_CONCLUSION}: ${CLASSIFICATION}"
          BODY_FILE="diagnosis_issue.md"
          {
            echo "- Workflow: \`${WORKFLOW_NAME}\`"
            echo "- Run: ${WORKFLOW_RUN_ID}"
            echo "- Conclusion: ${WORKFLOW_CONCLUSION}"
            echo "- Head SHA: ${WORKFLOW_HEAD_SHA}"
            echo "- 分类: ${CLASSIFICATION}"
            echo "- 判定原因: ${REASON}"
            echo
          } > "$BODY_FILE"
          if [ -s diagnosis_response.json ]; then
            {
              echo "## 免费端点 AI 诊断"
              echo
              echo '```'
              head -c 12000 diagnosis_response.json
              echo '```'
            } >> "$BODY_FILE"
          else
            echo "免费端点未能完成诊断（状态: ${{ steps.free_route.outputs.free_status }}）；请人工检查上述 run 日志。" >> "$BODY_FILE"
          fi

          # Ensure the label exists; an existing label makes this idempotent.
          # If repository metadata creation is unavailable, issue creation below
          # falls back to an unlabelled issue instead of losing the diagnosis.
          gh label create crawl-failure-diagnosis \
            --description "AI auto-diagnosed crawl failure" \
            --color E5502B >/dev/null 2>&1 || true

          # Use REST here instead of gh issue list's GraphQL query.  A transient
          # GraphQL error must not discard an otherwise valid crawl diagnosis.
          EXISTING=""
          if gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=crawl-failure-diagnosis&per_page=100" \
              --jq '.[] | select(.pull_request == null) | [.number, .title] | @tsv' \
              > open_diagnosis_issues.tsv; then
            EXISTING=$(WORKFLOW_NAME="$WORKFLOW_NAME" python - <<'PY'
          import os
          from pathlib import Path

          needle = os.environ["WORKFLOW_NAME"]
          for line in Path("open_diagnosis_issues.tsv").read_text(encoding="utf-8").splitlines():
              number, _, title = line.partition("\t")
              if needle in title:
                  print(number)
                  break
          PY
          )
          else
            echo "无法读取现有诊断 issue，直接创建新 issue"
          fi

          if [ -n "$EXISTING" ]; then
            echo "更新已有诊断 issue #${EXISTING}"
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            if ! gh issue create \
                --title "$TITLE" \
                --body-file "$BODY_FILE" \
                --label "crawl-failure-diagnosis"; then
              echo "带标签创建失败，回退为无标签诊断 issue"
              gh issue create \
                --title "$TITLE" \
                --body-file "$BODY_FILE"
            fi
          fi

      - name: Detect and cancel zombie runs
        if: always()
        continue-on-error: true
        run: |-
          # 检测 in_progress 但 90 分钟无 updatedAt 更新的 run（runner 掉线特征；
          # 爬虫 progress git 提交有 30 分钟 buffer，25 分钟会误杀正常长跑）
          python - <<'PYEOF'
          import json, os, subprocess, datetime

          repo = os.environ.get("GITHUB_REPOSITORY", "")
          if not repo:
              raise SystemExit(0)
          now = datetime.datetime.now(datetime.timezone.utc)
          out = subprocess.run(
              ["gh", "run", "list", "--repo", repo, "--limit", "15",
               "--json", "databaseId,status,updatedAt,workflowName"],
              capture_output=True, text=True, timeout=60,
          )
          if out.returncode != 0:
              print("gh run list failed:", out.stderr[:200])
              raise SystemExit(0)
          for run in json.loads(out.stdout):
              if run.get("status") != "in_progress":
                  continue
              updated = datetime.datetime.fromisoformat(
                  run["updatedAt"].replace("Z", "+00:00"))
              age = (now - updated).total_seconds()
              if age > 5400:  # 90 分钟无更新
                  print(f"!! zombie run {run['databaseId']} "
                        f"({run['workflowName']}) no update for {int(age)}s; cancelling")
                  subprocess.run(
                      ["gh", "run", "cancel", str(run["databaseId"]), "--repo", repo],
                      capture_output=True, text=True, timeout=60,
                  )
          PYEOF

      - name: Prepare repair prompt
        id: repair_prompt
        if: >-
          steps.classify.outputs.should_diagnose == 'true' &&
          (steps.classify.outputs.classification == 'site_breakage' ||
           steps.classify.outputs.classification == 'unknown' ||
           steps.classify.outputs.classification == 'low_output')
        run: |-
          EXCERPT=""
          if [ -s workflow_error.log ]; then
            EXCERPT="$(head -c 8000 workflow_error.log)"
          elif [ -s workflow_full.log ]; then
            EXCERPT="$(head -c 8000 workflow_full.log)"
          fi
          if [ -z "$EXCERPT" ]; then
            echo "无失败日志，跳过自修复"
            echo "should_repair=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_repair=true" >> "$GITHUB_OUTPUT"
          echo "$EXCERPT" > self_repair_excerpt.txt
          python scripts/self_repair_runner.py build-prompt             --log-excerpt "$EXCERPT"             --classification "${{ steps.classify.outputs.classification }}"             --reason "${{ steps.classify.outputs.reason }}"             --prompt-output prompt.md

      - name: Prepare isolated repair Agent directory
        if: steps.repair_prompt.outputs.should_repair == 'true'
        run: mkdir -p "$RUNNER_TEMP/opencode-agent"

      - name: Repair Agent
        id: repair_agent
        if: steps.repair_prompt.outputs.should_repair == 'true'
        continue-on-error: true
        env:
          KIMI_CODINGPLAN_API_KEY: ${{ secrets.KIMI_CODINGPLAN_API_KEY }}
          OPENCODE_CONFIG_CONTENT: >-
            {"autoupdate":false,"provider":{"kimi-coding-plan":{"npm":"@ai-sdk/openai-compatible","name":"Kimi Coding Plan","options":{"baseURL":"https://api.kimi.com/coding/v1","apiKey":"{env:KIMI_CODINGPLAN_API_KEY}"},"models":{"kimi-k2.6":{"limit":{"context":262144,"output":32768}}}}},"agent":{"plan":{"model":"kimi-coding-plan/kimi-k2.6","permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}},"permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}
        run: >-
          opencode run --pure --agent plan --model kimi-coding-plan/kimi-k2.6 --format default --dir "$RUNNER_TEMP/opencode-agent" "Return one JSON object with exactly these top-level fields: patch, reasoning, confidence. Do not call tools or modify files." --file prompt.md > repair_patch.json

      - name: Repair Agent fallback (Volcengine AgentPlan)
        id: repair_agent_ark
        if: >-
          steps.repair_prompt.outputs.should_repair == 'true' &&
          steps.repair_agent.outcome != 'success'
        continue-on-error: true
        env:
          VOLCENGINE_AGENTPLAN_API_KEY: ${{ secrets.VOLCENGINE_AGENTPLAN_API_KEY }}
          OPENCODE_CONFIG_CONTENT: >-
            {"autoupdate":false,"provider":{"volcengine-agentplan":{"npm":"@ai-sdk/openai-compatible","name":"Volcengine AgentPlan","options":{"baseURL":"https://ark.cn-beijing.volces.com/api/plan/v3","apiKey":"{env:VOLCENGINE_AGENTPLAN_API_KEY}"},"models":{"deepseek-v4-flash":{"limit":{"context":262144,"output":32768}}}}},"agent":{"plan":{"model":"volcengine-agentplan/deepseek-v4-flash","permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}},"permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}
        run: >-
          opencode run --pure --agent plan --model volcengine-agentplan/deepseek-v4-flash --format default --dir "$RUNNER_TEMP/opencode-agent" "Return one JSON object with exactly these top-level fields: patch, reasoning, confidence. Do not call tools or modify files." --file prompt.md > repair_patch.json

      - name: Apply and validate self-repair
        id: self_repair
        if: >-
          steps.repair_prompt.outputs.should_repair == 'true' &&
          steps.repair_agent.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
        run: |-
          case "${{ env.WORKFLOW_NAME }}" in
            "Crawl ZOL") WF_FILE="crawl-zol.yml" ;;
            "Crawl JD") WF_FILE="crawl-jd.yml" ;;
            "Crawl PConline") WF_FILE="crawl-pconline.yml" ;;
            "Merge and Filter") WF_FILE="merge-and-filter.yml" ;;
            "Deploy Pages") WF_FILE="deploy-pages.yml" ;;
            "CI") WF_FILE="ci.yml" ;;
            *) WF_FILE="crawl-zol.yml" ;;
          esac
          python scripts/self_repair_runner.py             --patch-file repair_patch.json             --classification "${{ steps.classify.outputs.classification }}"             --reason "${{ steps.classify.outputs.reason }}"             --workflow-name "${{ env.WORKFLOW_NAME }}"             --workflow-file "$WF_FILE"             --run-id "${{ env.WORKFLOW_RUN_ID }}"             --attempt-marker "self-repair-${{ env.WORKFLOW_RUN_ID }}-${{ env.WORKFLOW_HEAD_SHA }}"

      - name: Report monitor result
        if: always()
        run: |
          echo "classification=${{ steps.classify.outputs.classification }}"
          echo "reason=${{ steps.classify.outputs.reason }}"
          echo "should_diagnose=${{ steps.classify.outputs.should_diagnose }}"
          echo "free_status=${{ steps.free_route.outputs.free_status }}"
