name: Crawl PConline Search

on:
  workflow_dispatch:
  schedule:
    # 03:30 Asia/Shanghai daily (before morning crawl)
    - cron: "30 19 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: pconline-search-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
        with:
          persist-credentials: false

      - uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Configure required crawler proxy
        run: python scripts/setup_proxy_runtime.py

      - name: Download ZOL raw for search terms
        run: |
          python scripts/download_latest_crawler_artifact.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow crawl-zol.yml \
            --artifact-prefix zol-data- \
            --output data/raw/zol/latest.json \
            --min-records 50 || true
          # ZOL artifact 缺失时用线上 Pages 数据兜底（含 ZOL 机型列表）
          if [ ! -s data/raw/zol/latest.json ]; then
            python scripts/fetch_zol_fallback.py data/raw/zol/latest.json
          fi

      - name: Crawl PConline search supplements
        run: |
          # 发布集优先：Pages 单源 ZOL 机型的搜索词先搜（直接提升多源率）
          curl --fail --silent --show-error --location --retry 3 \
            "https://nbs.jiucai.eu.org/data/latest.json" \
            -o data/raw/pages_latest.json || true
          python scripts/crawl_pconline_search.py \
            --zol-input data/raw/zol/latest.json \
            --published-first data/raw/pages_latest.json \
            --output data/raw/pconline/search.json \
            --max-searches 600 \
            --delay 0.2

      - name: Upload search data
        uses: actions/upload-artifact@main
        with:
          name: pconline-search-data-${{ github.run_id }}
          path: data/raw/pconline/search.json
          retention-days: 30
          if-no-files-found: error
