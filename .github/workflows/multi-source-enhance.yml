name: Multi-Source Enhance

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write

concurrency:
  group: multi-source-enhance
  cancel-in-progress: false

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          token: ${{ secrets.ACTION_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Download latest crawler artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          mkdir -p data/raw/zol data/raw/pconline data/pages
          ZOL_ID=$(gh api repos/${{ github.repository }}/actions/artifacts --jq '[.artifacts[] | select(.name | startswith("zol-data-")) | select(.expired==false)] | sort_by(.created_at) | reverse | .[0].id' 2>/dev/null)
          PCL_ID=$(gh api repos/${{ github.repository }}/actions/artifacts --jq '[.artifacts[] | select(.name | startswith("pconline-data-")) | select(.expired==false)] | sort_by(.created_at) | reverse | .[0].id' 2>/dev/null)
          echo "ZOL_ID=$ZOL_ID PCL_ID=$PCL_ID"
          if [ -z "$ZOL_ID" ] || [ -z "$PCL_ID" ]; then
            echo "缺少 artifacts，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api repos/${{ github.repository }}/actions/artifacts/$ZOL_ID/zip > /tmp/zol.zip
          gh api repos/${{ github.repository }}/actions/artifacts/$PCL_ID/zip > /tmp/pcl.zip
          unzip -o -q /tmp/zol.zip -d data/raw/zol
          unzip -o -q /tmp/pcl.zip -d data/raw/pconline
          curl -s --max-time 30 "https://nbs.jiucai.eu.org/data/latest.json" -o data/pages/latest.json || echo "PAGES_FETCH_FAILED"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          ls -la data/raw/zol data/raw/pconline

      - name: Run multi-source enhancement scan
        id: mse_scan
        if: steps.artifacts.outputs.skip != 'true'
        continue-on-error: true
        run: |
          python scripts/multi_source_enhance.py \
            --pages data/pages/latest.json \
            --zol data/raw/zol/latest.json \
            --pconline data/raw/pconline/latest.json \
            --output multi-source-report.json
          python3 - <<'PYEOF'
          import json
          d = json.load(open('multi-source-report.json', encoding='utf-8'))
          s = d['summary']
          summary = f"overlap={s['raw_overlap_count']} compatible={s['compatible_overlap_count']} incompatible={s['incompatible_overlap_count']}"
          print("MSE_SUMMARY=" + summary)
          with open('mse_summary.txt', 'w', encoding='utf-8') as f:
              f.write(summary)
          PYEOF
          cat multi-source-report.json | head -40

      - name: Prepare merge-gap analysis prompt
        id: gap_prompt
        if: steps.mse_scan.outcome == 'success'
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          d = json.load(open('multi-source-report.json', encoding='utf-8'))
          overlaps = [o for o in d.get('raw_overlaps', []) if o.get('kind') == 'compatible']
          if not overlaps:
              print("NO_GAP")
              raise SystemExit(0)
          lines = ["分析以下 ZOL×PConline 兼容配置重叠为何未在 Pages 合并，并给出 merge_data.py 的修复建议："]
          for o in overlaps[:15]:
              lines.append(f"- ZOL: {o['a_title']} | PConline: {o['b_title']}")
          open('gap_prompt.md', 'w', encoding='utf-8').write("\n".join(lines))
          print(f"GAP_COUNT={len(overlaps)}")
          with open(env_var := os.environ.get('GITHUB_OUTPUT', ''), 'a', encoding='utf-8') as f:
              f.write(f"GAP_COUNT={len(overlaps)}\n")
          PYEOF

      - name: Prepare isolated repair Agent directory
        if: >-
          steps.mse_scan.outcome == 'success' &&
          steps.gap_prompt.outputs.GAP_COUNT != '' &&
          steps.gap_prompt.outputs.GAP_COUNT != '0'
        run: |
          mkdir -p "$RUNNER_TEMP/opencode-agent"
          cp gap_prompt.md "$RUNNER_TEMP/opencode-agent/prompt.md"

      - name: Set up Node.js for Agent tools
        if: >-
          steps.mse_scan.outcome == 'success' &&
          steps.gap_prompt.outputs.GAP_COUNT != '' &&
          steps.gap_prompt.outputs.GAP_COUNT != '0'
        uses: actions/setup-node@main
        with:
          node-version: "22"

      - name: Install OpenCode Agent CLI
        if: >-
          steps.mse_scan.outcome == 'success' &&
          steps.gap_prompt.outputs.GAP_COUNT != '' &&
          steps.gap_prompt.outputs.GAP_COUNT != '0'
        run: npm install -g opencode-ai@latest

      - name: Analyze merge gap via Agent (Volcengine AgentPlan)
        id: gap_agent
        if: >-
          steps.mse_scan.outcome == 'success' &&
          steps.gap_prompt.outputs.GAP_COUNT != '' &&
          steps.gap_prompt.outputs.GAP_COUNT != '0'
        continue-on-error: true
        env:
          VOLCENGINE_AGENTPLAN_API_KEY: ${{ secrets.VOLCENGINE_AGENTPLAN_API_KEY }}
          OPENCODE_CONFIG_CONTENT: >-
            {"autoupdate":false,"provider":{"volcengine-agentplan":{"npm":"@ai-sdk/openai-compatible","name":"Volcengine AgentPlan","options":{"baseURL":"https://ark.cn-beijing.volces.com/api/plan/v3","apiKey":"{env:VOLCENGINE_AGENTPLAN_API_KEY}"},"models":{"deepseek-v4-flash":{"limit":{"context":262144,"output":32768}}}}},"agent":{"plan":{"model":"volcengine-agentplan/deepseek-v4-flash","permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}},"permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}
        run: >-
          opencode run --pure --agent plan --model volcengine-agentplan/deepseek-v4-flash --format default --dir "$RUNNER_TEMP/opencode-agent" --file prompt.md "Return one JSON object: {root_cause, fix_suggestion, expected_impact}. Do not call tools or modify files." > gap_analysis.json

      - name: Report merge gap analysis
        if: steps.gap_agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.ACTION_PAT || github.token }}
        run: |
          python3 - <<'PYEOF'
          import json
          d = json.load(open('gap_analysis.json', encoding='utf-8'))
          if isinstance(d, str):
              d = json.loads(d)
          text = f"自动差异归并分析（UTC）：\n根因: {d.get('root_cause', 'N/A')}\n修复建议: {d.get('fix_suggestion', 'N/A')}\n预期影响: {d.get('expected_impact', 'N/A')}"
          print(text)
          with open('gap_report.txt', 'w', encoding='utf-8') as f:
              f.write(text)
          PYEOF
          gh issue comment 86 --repo "${{ github.repository }}" --body-file gap_report.txt || echo "issue 评论失败"
