name: Deploy Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Deploy and single-source audit mode'
        required: false
        type: choice
        options:
          - deploy_and_audit
          - deploy_only
          - audit_only
        default: deploy_and_audit
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  release:
    types: [published]

permissions: {}

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'audit_only' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest verified Release
        run: |
          mkdir -p release
          gh release download data-latest \
            --pattern laptops-latest.json \
            --dir release

      - name: Prepare Pages data
        run: |
          python scripts/prepare_pages_payload.py \
            --input release/laptops-latest.json \
            --config config/filter_conditions.json \
            --docs-dir docs

      - name: Configure Pages
        uses: actions/configure-pages@main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@main

      - name: Verify deployed manifest
        env:
          MANIFEST_URL: ${{ steps.deployment.outputs.page_url }}data/manifest.json
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          with open("docs/data/manifest.json", encoding="utf-8") as handle:
              expected = json.load(handle)
          error = "not attempted"
          for attempt in range(1, 13):
              try:
                  request = urllib.request.Request(
                      os.environ["MANIFEST_URL"],
                      headers={"Cache-Control": "no-cache", "User-Agent": "pages-readback"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      actual = json.load(response)
                  if actual == expected:
                      print(
                          "deployed manifest verified: "
                          f"rows={actual['rowCount']} sources={actual['sourceCounts']}"
                      )
                      break
                  error = "deployed manifest does not match staged release"
              except Exception as exc:
                  error = type(exc).__name__
              if attempt == 12:
                  raise SystemExit(f"manifest readback failed: {error}")
              time.sleep(10)
          PY

  audit:
    name: Single-source audit
    needs: deploy
    if: >-
      always() &&
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'deploy_only') &&
      (
        needs.deploy.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'audit_only')
      )
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch latest.json from Pages
        run: |
          REPO=$(echo ${{ github.repository }} | sed 's|.*/||')
          case "$REPO" in
            crawl_cars) PAGES_URL="https://cars.jiucai.eu.org/data/latest.json" ;;
            crawl_phones) PAGES_URL="https://phones.jiucai.eu.org/data/latest.json" ;;
            crawl_laptops) PAGES_URL="https://nbs.jiucai.eu.org/data/latest.json" ;;
            *) echo "Unknown repo"; exit 0 ;;
          esac
          echo "PAGES_URL=$PAGES_URL"
          mkdir -p ./data
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 180 "$PAGES_URL" -o ./data/latest.json || echo "FETCH_FAILED"

      - name: Analyze single-source data
        run: |
          python3 scripts/analyze_single_source.py --data ./data/latest.json --output ./audit_report.json
          cat ./audit_report.json | head -50

      - name: Prepare deterministic audit prompt for Agent
        id: audit_prompt
        run: |
          python3 scripts/llm_single_source_audit.py \
            --data ./data/latest.json \
            --report ./audit_report.json \
            --output ./llm_analysis.md \
            --prompt-output ./llm_agent_prompt.md \
            --manifest-output ./llm_agent_manifest.json

      - name: Set up Node.js for Agent tools
        if: steps.audit_prompt.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode CLI (latest, auto-upgrades)
        if: steps.audit_prompt.outcome == 'success'
        continue-on-error: true
        run: npm install --global opencode-ai@latest

      - name: Run configured free endpoints first
        id: free_route
        if: steps.audit_prompt.outcome == 'success'
        continue-on-error: true
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZEN_API_KEY: ${{ secrets.ZEN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          MODAL_API_KEY: ${{ secrets.MODAL_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          ATOMGIT_API_KEY: ${{ secrets.ATOMGIT_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/free_first_router.py \
            --prompt-file ./llm_agent_prompt.md \
            --output ./free_agent_analysis.md \
            --metadata-output ./ai_route.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare isolated OpenCode directory
        if: steps.audit_prompt.outcome == 'success' && steps.free_route.outputs.paid_required == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode-agent"
          cp "$GITHUB_WORKSPACE/llm_agent_prompt.md" "$RUNNER_TEMP/opencode-agent/prompt.md"
          echo "PLAN_REQUEST_ID=$(jq -r .request_id "$GITHUB_WORKSPACE/llm_agent_manifest.json")" >> "$GITHUB_ENV"
          echo "PLAN_PROMPT_SHA256=$(jq -r .prompt_sha256 "$GITHUB_WORKSPACE/llm_agent_manifest.json")" >> "$GITHUB_ENV"

      - name: Run Kimi Coding Plan through read-only OpenCode Agent
        id: kimi_agent
        if: steps.audit_prompt.outcome == 'success' && steps.free_route.outputs.paid_required == 'true'
        continue-on-error: true
        env:
          KIMI_CODINGPLAN_API_KEY: ${{ secrets.KIMI_CODINGPLAN_API_KEY }}
          OPENCODE_CONFIG_CONTENT: >-
            {"autoupdate":false,"provider":{"kimi-coding-plan":{"npm":"@ai-sdk/openai-compatible","name":"Kimi Coding Plan","options":{"baseURL":"https://api.kimi.com/coding/v1","apiKey":"{env:KIMI_CODINGPLAN_API_KEY}"},"models":{"kimi-k2.6":{"limit":{"context":262144,"output":32768}}}}},"agent":{"plan":{"model":"kimi-coding-plan/kimi-k2.6","permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}},"permission":{"*":"deny","read":"allow","edit":"deny","bash":"deny","webfetch":"deny","task":"deny","question":"deny","external_directory":"deny"}}
        run: >-
          opencode run --pure --agent plan --model kimi-coding-plan/kimi-k2.6 --format default --dir "$RUNNER_TEMP/opencode-agent" --file prompt.md "Return only the requested analysis. The response must contain exactly one plain line REQUEST_ID: $PLAN_REQUEST_ID and exactly one plain line PROMPT_SHA256: $PLAN_PROMPT_SHA256, then the analysis. Do not call tools or modify files." > ./llm_agent_analysis.md

      - name: Finalize audit analysis without passing Plan key to Python
        if: always()
        run: |
          if [[ "${{ steps.free_route.outputs.free_status }}" == "success" && -s ./free_agent_analysis.md ]]; then
            if ! python3 scripts/llm_single_source_audit.py \
              --data ./data/latest.json \
              --report ./audit_report.json \
              --output ./llm_analysis.md \
              --agent-response-input ./free_agent_analysis.md; then
              python3 scripts/llm_single_source_audit.py \
                --data ./data/latest.json \
                --report ./audit_report.json \
                --output ./llm_analysis.md \
                --fallback-only
            fi
          elif [[ "${{ steps.free_route.outputs.paid_required }}" == "true" &&
                  "${{ steps.kimi_agent.outcome }}" == "success" &&
                  -s ./llm_agent_analysis.md ]]; then
            if ! python3 scripts/llm_single_source_audit.py \
              --data ./data/latest.json \
              --report ./audit_report.json \
              --output ./llm_analysis.md \
              --agent-response-input ./llm_agent_analysis.md \
              --request-manifest ./llm_agent_manifest.json; then
              python3 scripts/llm_single_source_audit.py \
                --data ./data/latest.json \
                --report ./audit_report.json \
                --output ./llm_analysis.md \
                --fallback-only
            fi
          else
            python3 scripts/llm_single_source_audit.py \
              --data ./data/latest.json \
              --report ./audit_report.json \
              --output ./llm_analysis.md \
              --fallback-only
          fi
          echo "=== LLM Analysis ==="
          head -80 ./llm_analysis.md || true

      - name: Create or update issue
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('./audit_report.json', 'utf8');
            const analysis = fs.existsSync('./llm_analysis.md') ? fs.readFileSync('./llm_analysis.md', 'utf8') : 'No LLM analysis available';
            const reportData = JSON.parse(report);
            const title = `Single-source audit: ${reportData.single_rate}% single (${reportData.single_count}/${reportData.total})`;
            const body = `## Single Source Audit Report

            **Generated:** ${new Date().toISOString()}
            **Total rows:** ${reportData.total}
            **Multi-source:** ${reportData.multi_count} (${reportData.multi_rate}%)
            **Single-source:** ${reportData.single_count} (${reportData.single_rate}%)

            ### Root Causes

            ${JSON.stringify(reportData.causes, null, 2)}

            ### LLM Analysis (AA 50+ model)

            ${analysis}

            ### Source Distribution

            ${JSON.stringify(reportData.source_distribution, null, 2)}
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'single-source-audit'
            });

            const existing = issues.data.find(i => i.title.startsWith('Single-source audit:'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title,
                body
              });
              console.log(`Updated issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['single-source-audit', 'automated']
              });
              console.log('Created new issue');
            }
