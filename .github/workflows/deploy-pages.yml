name: Deploy Pages

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download latest verified Release
        run: |
          mkdir -p release
          gh release download data-latest \
            --pattern laptops-latest.json \
            --dir release

      - name: Prepare Pages data
        run: |
          python scripts/prepare_pages_payload.py \
            --input release/laptops-latest.json \
            --config config/filter_conditions.json \
            --docs-dir docs

      - name: Configure Pages
        uses: actions/configure-pages@main

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: docs

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@main

      - name: Verify deployed manifest
        env:
          MANIFEST_URL: ${{ steps.deployment.outputs.page_url }}data/manifest.json
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          with open("docs/data/manifest.json", encoding="utf-8") as handle:
              expected = json.load(handle)
          error = "not attempted"
          for attempt in range(1, 13):
              try:
                  request = urllib.request.Request(
                      os.environ["MANIFEST_URL"],
                      headers={"Cache-Control": "no-cache", "User-Agent": "pages-readback"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      actual = json.load(response)
                  if actual == expected:
                      print(
                          "deployed manifest verified: "
                          f"rows={actual['rowCount']} sources={actual['sourceCounts']}"
                      )
                      break
                  error = "deployed manifest does not match staged release"
              except Exception as exc:
                  error = type(exc).__name__
              if attempt == 12:
                  raise SystemExit(f"manifest readback failed: {error}")
              time.sleep(10)
          PY
